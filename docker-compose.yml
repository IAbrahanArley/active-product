services:
  provider:
    image: wiremock/wiremock:3.13.2
    ports:
      - "8081:8080"
    volumes:
      - ./docker/wiremock/mappings:/home/wiremock/mappings:ro

  postgres:
    image: postgres:16-alpine
    container_name: product-postgres
    environment:
      POSTGRES_DB: product
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - product-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d product"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product-api
    depends_on:
      postgres:
        condition: service_healthy
      provider:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/product
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      JWT_ISSUER: ${JWT_ISSUER:-https://auth.local.test}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-product-activation-service}
      PROVIDER_BASE_URL: http://provider:8080
      PROVIDER_IDEMPOTENCY_SUPPORTED: "false"
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 60s
    ports:
      - "8080:8080"

volumes:
  product-postgres-data:
