spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 20s
  application:
    name: product-activation-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/product}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
server:
  shutdown: graceful
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  processing:
    enabled: ${PROCESSING_ENABLED:true}
    poll-delay: ${PROCESSING_POLL_DELAY:1000}
  provider:
    base-url: ${PROVIDER_BASE_URL:http://localhost:8081}
    connect-timeout: ${PROVIDER_CONNECT_TIMEOUT:2s}
    read-timeout: ${PROVIDER_READ_TIMEOUT:3s}
    max-attempts: ${PROVIDER_MAX_ATTEMPTS:3}
    retry-delay: ${PROVIDER_RETRY_DELAY:2s}
    idempotency-supported: ${PROVIDER_IDEMPOTENCY_SUPPORTED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173,http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    issuer: ${JWT_ISSUER:https://auth.local.test}
    audience: ${JWT_AUDIENCE:product-activation-service}
